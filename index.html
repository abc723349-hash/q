<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jeu : Attrape la pomme</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #a7e0ff 0%, #f5f9ff 70%);
    }

    .game-shell {
      width: min(94vw, 820px);
      padding: 1rem;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 14px 36px rgba(9, 39, 82, 0.18);
    }

    h1 {
      margin: 0 0 0.5rem;
      text-align: center;
      color: #153f73;
      font-size: 1.5rem;
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 0.7rem;
      color: #264f80;
      font-weight: 600;
      flex-wrap: wrap;
    }

    #game {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      background: linear-gradient(180deg, #d9ffd6 0%, #9be57a 100%);
      border: 3px solid #75b058;
      display: block;
    }

    .controls {
      margin-top: 0.7rem;
      text-align: center;
      color: #2d4c37;
      font-size: 0.95rem;
    }

    button {
      border: none;
      background: #ef5a5a;
      color: #fff;
      border-radius: 999px;
      padding: 0.5rem 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.05);
    }
  </style>
</head>
<body>
  <main class="game-shell">
    <h1>Un enfant qui court pour attraper une pomme</h1>
    <section class="hud">
      <div>Score: <span id="score">0</span></div>
      <div>Temps: <span id="timer">30</span>s</div>
      <button id="restart" type="button">Rejouer</button>
    </section>
    <canvas id="game" width="800" height="450" aria-label="Zone de jeu"></canvas>
    <p class="controls">Utilise les flèches ← → ↑ ↓ (ou ZQSD) pour déplacer l'enfant.</p>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const timerEl = document.getElementById("timer");
    const restartBtn = document.getElementById("restart");

    const state = {
      running: true,
      score: 0,
      remaining: 30,
      lastTick: performance.now(),
      keys: new Set(),
      child: {
        x: canvas.width / 2,
        y: canvas.height - 90,
        size: 34,
        speed: 300,
      },
      apple: {
        x: 120,
        y: 120,
        radius: 16,
      },
    };

    function randomPos(radius) {
      return {
        x: radius + Math.random() * (canvas.width - radius * 2),
        y: radius + Math.random() * (canvas.height - radius * 2),
      };
    }

    function placeApple() {
      const pos = randomPos(state.apple.radius + 6);
      state.apple.x = pos.x;
      state.apple.y = pos.y;
    }

    function resetGame() {
      state.running = true;
      state.score = 0;
      state.remaining = 30;
      state.lastTick = performance.now();
      state.child.x = canvas.width / 2;
      state.child.y = canvas.height - 90;
      placeApple();
      scoreEl.textContent = "0";
      timerEl.textContent = "30";
      requestAnimationFrame(loop);
    }

    function drawChild() {
      const { x, y, size } = state.child;
      // tête
      ctx.fillStyle = "#ffd7b5";
      ctx.beginPath();
      ctx.arc(x, y - size * 0.9, size * 0.32, 0, Math.PI * 2);
      ctx.fill();

      // corps
      ctx.fillStyle = "#356ed8";
      ctx.fillRect(x - size * 0.27, y - size * 0.65, size * 0.54, size * 0.9);

      // jambes
      ctx.fillStyle = "#2f4f7d";
      ctx.fillRect(x - size * 0.28, y + size * 0.23, size * 0.2, size * 0.62);
      ctx.fillRect(x + size * 0.08, y + size * 0.23, size * 0.2, size * 0.62);
    }

    function drawApple() {
      const { x, y, radius } = state.apple;
      ctx.fillStyle = "#ea2e49";
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#7d4218";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(x + 1, y - radius + 2);
      ctx.lineTo(x + 5, y - radius - 9);
      ctx.stroke();

      ctx.fillStyle = "#4aa944";
      ctx.beginPath();
      ctx.ellipse(x + 9, y - radius - 2, 9, 5, Math.PI / 4, 0, Math.PI * 2);
      ctx.fill();
    }

    function update(delta) {
      if (!state.running) return;

      const moveX = (state.keys.has("ArrowRight") || state.keys.has("d") || state.keys.has("D"))
        - (state.keys.has("ArrowLeft") || state.keys.has("q") || state.keys.has("Q") || state.keys.has("a") || state.keys.has("A"));
      const moveY = (state.keys.has("ArrowDown") || state.keys.has("s") || state.keys.has("S"))
        - (state.keys.has("ArrowUp") || state.keys.has("z") || state.keys.has("Z") || state.keys.has("w") || state.keys.has("W"));

      const magnitude = Math.hypot(moveX, moveY) || 1;
      state.child.x += (moveX / magnitude) * state.child.speed * delta;
      state.child.y += (moveY / magnitude) * state.child.speed * delta;

      const bounds = state.child.size * 0.45;
      state.child.x = Math.min(canvas.width - bounds, Math.max(bounds, state.child.x));
      state.child.y = Math.min(canvas.height - bounds, Math.max(bounds, state.child.y));

      const dx = state.child.x - state.apple.x;
      const dy = (state.child.y - state.child.size * 0.15) - state.apple.y;
      const catchDistance = state.apple.radius + state.child.size * 0.45;
      if (dx * dx + dy * dy < catchDistance * catchDistance) {
        state.score += 1;
        scoreEl.textContent = String(state.score);
        placeApple();
      }

      state.remaining -= delta;
      timerEl.textContent = Math.max(0, Math.ceil(state.remaining)).toString();
      if (state.remaining <= 0) {
        state.running = false;
      }
    }

    function drawScene() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // nuages simples
      ctx.fillStyle = "rgba(255,255,255,0.8)";
      for (let i = 0; i < 5; i++) {
        const x = (i * 180 + 60) % canvas.width;
        const y = 45 + (i % 2) * 26;
        ctx.beginPath();
        ctx.arc(x, y, 24, 0, Math.PI * 2);
        ctx.arc(x + 24, y + 3, 19, 0, Math.PI * 2);
        ctx.arc(x - 22, y + 5, 17, 0, Math.PI * 2);
        ctx.fill();
      }

      drawApple();
      drawChild();

      if (!state.running) {
        ctx.fillStyle = "rgba(0,0,0,0.44)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.font = "bold 46px sans-serif";
        ctx.fillText("Temps écoulé !", canvas.width / 2, canvas.height / 2 - 10);
        ctx.font = "30px sans-serif";
        ctx.fillText(`Score final : ${state.score}`, canvas.width / 2, canvas.height / 2 + 42);
      }
    }

    function loop(now) {
      const delta = Math.min(0.033, (now - state.lastTick) / 1000);
      state.lastTick = now;

      update(delta);
      drawScene();

      if (state.running) {
        requestAnimationFrame(loop);
      }
    }

    window.addEventListener("keydown", (event) => state.keys.add(event.key));
    window.addEventListener("keyup", (event) => state.keys.delete(event.key));
    restartBtn.addEventListener("click", resetGame);

    placeApple();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
